<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>夏休み出勤可能日登録</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;background:#f3f6fb;color:#1f2937}
.hero{background:linear-gradient(135deg,#58b8f7,#3158d6);color:white;text-align:center;padding:30px 16px 28px}
.hero h1{font-size:26px;margin:0 0 8px;font-weight:800}
.hero .sub{font-size:15px;font-weight:700;opacity:.95}
.hero .ver{font-size:11px;font-weight:700;opacity:.9;margin-left:4px}
.wrap{max-width:760px;margin:0 auto;padding:18px}
.card{background:white;border-radius:22px;padding:22px;box-shadow:0 14px 35px rgba(15,23,42,.08)}
h2{text-align:center;color:#3b62df;margin:0 0 20px;font-size:24px}
label{display:block;font-weight:800;margin:16px 0 8px}
.school-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.school-btn{border:2px solid #d1d5db;border-radius:16px;background:white;padding:18px 6px;font-size:21px;font-weight:800;color:#374151}
.school-btn.selected{border-color:#3b62df;background:#eff6ff;color:#2f55cf}
input{width:100%;font-size:24px;text-align:center;padding:14px;border:2px solid #d1d5db;border-radius:14px}
.primary{width:100%;border:0;border-radius:16px;background:#3b62df;color:white;font-size:22px;font-weight:800;padding:17px;margin-top:20px}
.primary:disabled{background:#9ca3af}
.msg{margin-top:18px;border-radius:14px;padding:14px 16px;font-weight:800;line-height:1.6;display:none}
.msg.err{display:block;background:#fff7ed;border:1px solid #fed7aa;color:#8a3a1c}
.msg.ok{display:block;background:#ecfdf5;border:1px solid #a7f3d0;color:#166534}
.bar{position:sticky;top:0;z-index:5;background:#2749b8;color:white;padding:12px 16px;font-weight:800}
.info{background:#fff7ed;color:#92400e;border:1px solid #fed7aa;border-radius:12px;padding:10px 12px;font-weight:800;margin:0 0 12px}
.legend{font-size:13px;background:white;padding:10px;border-radius:12px;margin-bottom:10px;line-height:1.8}
.table-wrap{overflow-x:auto;background:white;border-radius:14px;box-shadow:0 4px 12px rgba(15,23,42,.05)}
table{border-collapse:collapse;width:100%;min-width:560px}
th{background:#374151;color:white;padding:9px 5px;font-size:12px}
td{border:1px solid #e5e7eb;text-align:center;padding:5px}
td.date{position:sticky;left:0;background:white;font-weight:800;min-width:82px;z-index:1}
tr:nth-child(even) td.date{background:#f9fafb}
tr:nth-child(even) td{background:#f9fafb}
.holiday td{background:#e0f2fe!important;color:#075985;font-weight:800;padding:12px}
.slot{width:44px;height:44px;border-radius:10px;border:2px solid #d1d5db;background:white;font-size:18px;font-weight:900}
.slot.on{background:#2563eb;border-color:#2563eb;color:white}
.slot.tri{background:#f97316;border-color:#f97316;color:white}
.slot:disabled{opacity:.45}
.save-area{padding:14px 0 0}
.small{font-size:12px;color:#6b7280;text-align:center;margin-top:12px}
.hidden{display:none}
</style>
</head>
<body>
<div class="hero">
  <h1>☀️ 夏休み出勤可能日登録</h1>
  <div class="sub">個別指導ステップ<span class="ver">Ver.1.7</span></div>
</div>

<div id="loginScreen" class="wrap">
  <div class="card">
    <h2>ログイン</h2>
    <label>校舎を選んでください</label>
    <div class="school-row">
      <button id="schoolShinryo" class="school-btn selected" type="button">神領校</button>
      <button id="schoolOtemachi" class="school-btn" type="button">大手町校</button>
    </div>

    <label>コード番号（半角数字）</label>
    <input id="codeInput" type="number" inputmode="numeric" placeholder="例：7002">

    <button id="loginBtn" class="primary" type="button">ログイン</button>
    <div id="loginMsg" class="msg"></div>
    <div class="small">画面：GitHub Pages ／ データ通信：Google Apps Script</div>
  </div>
</div>

<div id="mainScreen" class="hidden">
  <div id="topBar" class="bar"></div>
  <div class="wrap">
    <div id="deadlineInfo" class="info hidden"></div>
    <div class="legend">
      ○：出勤できる　／　△：無理すれば可　／　空白：不可・未入力<br>
      ボタンは「空白 → ○ → △ → 空白」の順に変わります。
    </div>
    <div id="tableArea" class="table-wrap"></div>
    <div class="save-area">
      <button id="saveBtn" class="primary" type="button">保存して送信する</button>
      <div id="saveMsg" class="msg"></div>
    </div>
  </div>
</div>

<script>
const APP_VERSION = '1.7';
const STORAGE_PREFIX = 'summer_teacher_app_v1_7_';
const GAS_API = 'https://script.google.com/macros/s/AKfycbx8UeG5X_WSonK8StzuB8B_iC4BACDw3guGZgQvuSAWnxJCfUwnsycZLC5Wn19HBGO3pQ/exec';

let school = '神領';
let teacher = null;
let slots = [];
let availability = {};
let locked = false;

function $(id){ return document.getElementById(id); }

function clearOldStorageOnce(){
  const key = STORAGE_PREFIX + 'cleared';
  if(localStorage.getItem(key) === APP_VERSION) return;
  Object.keys(localStorage).forEach(k => {
    if(k.startsWith('step_') || k.startsWith('teacher_') || k.startsWith('summer_teacher_app_')){
      localStorage.removeItem(k);
    }
  });
  localStorage.setItem(key, APP_VERSION);
}

function showMsg(id, text, ok=false){
  const el = $(id);
  el.textContent = text || '';
  el.className = 'msg ' + (ok ? 'ok' : 'err');
  el.style.display = text ? 'block' : 'none';
}

function jsonp(params){
  return new Promise((resolve, reject) => {
    const cb = 'cb_' + Date.now() + '_' + Math.random().toString(36).slice(2);
    const url = new URL(GAS_API);
    Object.entries(params).forEach(([k,v]) => url.searchParams.set(k, v));
    url.searchParams.set('callback', cb);
    url.searchParams.set('_', Date.now());

    const script = document.createElement('script');
    const timer = setTimeout(() => {
      cleanup();
      reject(new Error('通信タイムアウト'));
    }, 20000);

    function cleanup(){
      clearTimeout(timer);
      delete window[cb];
      if(script.parentNode) script.parentNode.removeChild(script);
    }

    window[cb] = data => {
      cleanup();
      resolve(data);
    };

    script.onerror = () => {
      cleanup();
      reject(new Error('Google Apps Scriptとの通信に失敗しました'));
    };

    script.src = url.toString();
    document.body.appendChild(script);
  });
}

function setSchool(s){
  school = s;
  $('schoolShinryo').classList.toggle('selected', s === '神領');
  $('schoolOtemachi').classList.toggle('selected', s === '大手町');
  showMsg('loginMsg','');
}

async function login(){
  const code = $('codeInput').value.trim();
  if(!code){
    showMsg('loginMsg','コード番号を入力してください。');
    return;
  }

  $('loginBtn').disabled = true;
  showMsg('loginMsg','通信中です...', true);

  try{
    const r = await jsonp({ action:'login', code });
    if(!r.ok) throw new Error(r.error || 'ログインできませんでした');

    teacher = { code, name:r.name, email:r.email || '' };
    localStorage.setItem(STORAGE_PREFIX + 'code', code);

    const dl = await jsonp({ action:'checkDeadline', school });
    locked = !!dl.locked;

    const sl = await jsonp({ action:'getSlots', school });
    if(!sl.ok) throw new Error(sl.error || '授業枠を取得できませんでした');
    slots = sl.slots || [];

    const av = await jsonp({ action:'getMyAvailability', code, school });
    if(!av.ok) throw new Error(av.error || '入力済みデータを取得できませんでした');
    availability = av.entries || {};

    openMain(dl);
  }catch(e){
    showMsg('loginMsg', e.message || String(e));
  }finally{
    $('loginBtn').disabled = false;
  }
}

function openMain(dl){
  $('loginScreen').classList.add('hidden');
  $('mainScreen').classList.remove('hidden');
  $('topBar').textContent = school + '校　' + teacher.name + 'さん';

  if(dl && dl.deadline){
    const t = locked
      ? '締め切りを過ぎているため変更できません。締め切り：' + dl.deadline
      : '登録・変更締め切り：' + dl.deadline + '（あと' + dl.daysLeft + '日）';
    $('deadlineInfo').textContent = t;
    $('deadlineInfo').classList.remove('hidden');
  }

  render();
}

function render(){
  const start = ['13:00','14:20','15:45','17:10','18:35','20:00'];
  const end   = ['14:15','15:35','17:00','18:25','19:50','21:15'];

  let h = '<table><thead><tr><th>日付</th>';
  for(let i=0;i<6;i++) h += '<th>' + start[i] + '<br>' + end[i] + '</th>';
  h += '</tr></thead><tbody>';

  slots.forEach(sl => {

    h += '<tr><td class="date">' + sl.date + '</td>';
    for(let i=0;i<6;i++){
      h += '<td>';
      if(!sl.enabled[i]){
        h += 'ー';
      }else{
        const key = sl.rawDate + '|' + i;
        const val = availability[key] || '';
        const cls = val === '○' ? ' on' : (val === '△' ? ' tri' : '');
        h += '<button class="slot' + cls + '" type="button" data-key="' + key + '"' + (locked ? ' disabled' : '') + '>' + val + '</button>';
      }
      h += '</td>';
    }
    h += '</tr>';
  });

  h += '</tbody></table>';
  $('tableArea').innerHTML = h;
}

function toggle(key){
  if(locked) return;
  const cur = availability[key] || '';
  if(cur === '') availability[key] = '○';
  else if(cur === '○') availability[key] = '△';
  else delete availability[key];
  render();
}

async function save(){
  if(locked){
    showMsg('saveMsg','締め切りを過ぎているため変更できません。');
    return;
  }

  const entries = [];
  slots.forEach(sl => {
    if(sl.holiday) return;
    for(let i=0;i<6;i++){
      if(!sl.enabled[i]) continue;
      const key = sl.rawDate + '|' + i;
      const val = availability[key] || '';
      if(val === '○' || val === '△'){
        entries.push({ rawDate:sl.rawDate, slotIndex:i, value:val });
      }
    }
  });

  $('saveBtn').disabled = true;
  showMsg('saveMsg','保存中です...', true);

  try{
    const r = await jsonp({
      action:'saveAvailability',
      code:teacher.code,
      school,
      entries:JSON.stringify(entries)
    });
    if(!r.ok) throw new Error(r.error || '保存できませんでした');
    showMsg('saveMsg','保存しました。登録数：' + r.saved + '件', true);
  }catch(e){
    showMsg('saveMsg', e.message || String(e));
  }finally{
    $('saveBtn').disabled = false;
  }
}

document.addEventListener('DOMContentLoaded', () => {
  clearOldStorageOnce();

  const oldCode = localStorage.getItem(STORAGE_PREFIX + 'code');
  if(oldCode) $('codeInput').value = oldCode;

  $('schoolShinryo').addEventListener('click', () => setSchool('神領'));
  $('schoolOtemachi').addEventListener('click', () => setSchool('大手町'));
  $('loginBtn').addEventListener('click', login);
  $('saveBtn').addEventListener('click', save);

  document.addEventListener('click', e => {
    const b = e.target.closest('.slot');
    if(!b) return;
    toggle(b.dataset.key);
  });
});
</script>
<div class="small">Build 2026-06-28 10:31</div>
</body>
</html>
