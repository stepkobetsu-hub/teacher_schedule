<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>夏休み出勤可能日登録</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;background:#eef3fb;color:#111827;overflow-x:hidden}
.hero{background:linear-gradient(135deg,#4aa9f5,#3158d6);color:#fff;text-align:center;padding:24px 16px}
.hero h1{font-size:22px;margin:0 0 6px;font-weight:900}.hero small{font-size:12px}
.wrap{max-width:820px;margin:0 auto;padding:16px}.card{background:#fff;border-radius:18px;padding:22px;box-shadow:0 12px 30px rgba(15,23,42,.08)}
h2{text-align:center;color:#3158d6}label{display:block;font-weight:900;margin:14px 0 7px}
.schoolRow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{border:0;border-radius:12px;padding:14px;font-weight:900;font-size:16px;cursor:pointer}
.schoolBtn{background:#fff;border:2px solid #d1d5db;color:#111827}.schoolBtn.on{border-color:#3158d6;background:#eff6ff;color:#3158d6}
input{width:100%;font-size:24px;text-align:center;padding:13px;border:2px solid #d1d5db;border-radius:12px}
.primary{width:100%;background:#3158d6;color:#fff;margin-top:18px;font-size:22px}
.msg{display:none;margin-top:14px;padding:12px;border-radius:12px;font-weight:900;white-space:pre-wrap;line-height:1.5}
.ok{display:block;background:#ecfdf5;color:#166534;border:1px solid #a7f3d0;font-size:18px;text-align:center}.err{display:block;background:#fff7ed;color:#8a3a1c;border:1px solid #fed7aa}
.logout{position:fixed;right:8px;top:36px;z-index:100;background:#c62828;color:#fff;border-radius:999px;padding:5px 9px;font-size:11px;line-height:1}.topBack{position:fixed;right:8px;top:6px;z-index:100;background:#fff;color:#2749b8;border:1.5px solid #2749b8;border-radius:999px;padding:4px 8px;font-size:11px;line-height:1}
.top{position:sticky;top:0;z-index:20;background:#2749b8;color:#fff;padding:10px 12px}.topLine{display:flex;justify-content:space-between;align-items:center;gap:10px}
.name{font-size:25px;font-weight:950;text-align:center;flex:1}.actions{display:flex;gap:8px}.mini{background:#fff;color:#2749b8;padding:8px 12px;font-size:13px}
.legend{background:#fff;border-radius:12px;padding:10px;margin-bottom:10px;line-height:1.7;font-weight:700}.tableWrap{overflow-x:auto;overflow-y:visible;background:#fff;border-radius:12px;box-shadow:0 4px 12px rgba(15,23,42,.05);max-width:100%;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;min-width:540px}th{background:#374151;color:#fff;position:sticky;top:58px;z-index:15;font-size:12px;padding:8px 4px}
td{border:1px solid #e5e7eb;text-align:center;padding:5px}td.date{position:sticky;left:0;background:#fff;font-size:11px;font-weight:900;min-width:96px;z-index:2}
.slot{
width:42px;height:42px;border:2px solid #d1d5db;background:#fff;border-radius:9px;
display:flex;align-items:center;justify-content:center;padding:0;margin:0 auto;
font-size:0;line-height:1;position:relative;
}
.slot.on{background:#2563eb;color:#fff}
.slot.tri{background:#f97316;color:#fff}
.slot.on::before{
content:"";display:block;width:17px;height:17px;border:3px solid #fff;border-radius:50%;
}
.slot.tri::before{
content:"";display:block;width:0;height:0;
border-left:12px solid transparent;border-right:12px solid transparent;border-bottom:22px solid #fff;
}
.slot.tri::after{
content:"";position:absolute;width:0;height:0;
border-left:8px solid transparent;border-right:8px solid transparent;border-bottom:15px solid #f97316;
top:12px;
}
.hidden{display:none}.save{position:sticky;bottom:0;background:#eef3fb;padding:10px 0}

@media print{
  .slot{border:0!important;background:#fff!important;color:#000!important;width:auto!important;height:auto!important;font-size:12px!important;display:inline!important}
  .slot.on::before,.slot.tri::before,.slot.tri::after{display:none!important}
  .slot.on::after{content:"○"!important;display:inline!important;position:static!important;color:#000!important}
  .slot.tri::after{content:"△"!important;display:inline!important;position:static!important;color:#000!important;border:0!important}
}


th.dateHead{left:0;z-index:18;min-width:96px}
.save{position:sticky;bottom:0;z-index:30;background:#eef3fb;padding:12px 0 14px;width:100%;left:0;right:0}
.save .primary{display:block;width:100%;margin:0;font-size:22px;padding:14px 16px;border-radius:14px}
@media(max-width:640px){
  .hero{padding:20px 16px}
  .hero h1{font-size:22px}
  .name{font-size:24px}
  table{min-width:520px}
  th{top:58px;font-size:11px}
  td.date{min-width:88px;font-size:10px}
  .slot{width:39px;height:39px}
  .save .primary{font-size:22px;padding:13px 16px}
}


.helpBox{margin-bottom:10px}
.helpBtn{background:#fff;color:#2749b8;border:2px solid #2749b8;border-radius:12px;padding:9px 12px;font-size:14px}
.helpBox .legend{margin-top:8px}
</style>
</head>
<body>
<div id="pageTop"></div>
<button id="topBackBtn" class="topBack hidden" type="button">←トップへ</button>
<button id="logoutTop" class="logout hidden" type="button">ログアウト</button>
<div class="hero"><h1>夏休み出勤可能日登録</h1><div>個別指導ステップ <small>Supabase Ver.2.0</small></div></div>

<div id="login" class="wrap"><div class="card">
<h2>ログイン</h2>
<label>校舎</label>
<div class="schoolRow"><button id="s1" class="schoolBtn on" type="button">神領校</button><button id="s2" class="schoolBtn" type="button">大手町校</button></div>
<label>コード番号</label><input id="code" inputmode="numeric" type="number" placeholder="例：7002">
<button id="loginBtn" class="primary" type="button">ログイン</button>
<div id="loginMsg" class="msg"></div>
</div></div>

<div id="main" class="hidden">
<div class="top"><div class="topLine"><div id="teacherName" class="name"></div><div class="actions"><button id="printBtn" class="mini" type="button">🖨 印刷</button></div></div></div>
<div class="wrap">
<div class="helpBox"><button id="helpToggle" class="helpBtn" type="button">○・△の説明を表示</button><div id="helpText" class="legend hidden">○：出勤できる ／ △：無理すれば可 ／ 空白：不可・未入力<br>ボタンは「空白 → ○ → △ → 空白」の順に変わります。</div></div>
<div id="tableArea" class="tableWrap"></div>
<div class="save"><button id="saveBtn" class="primary" type="button">保存して送信</button><div id="saveMsg" class="msg"></div></div>
</div></div>

<script>
const SUPABASE_URL = 'https://jbiolkvegexkqjcwtyye.supabase.co';
const SUPABASE_KEY = 'sb_publishable_1si6OSrS0AGP19FstAudug_ErlLMMqX';

let school = '神領';
let teacher = null;
let days = [];
let avail = {};
const timeHeaders = ['13:00<br>14:15','14:20<br>15:35','15:45<br>17:00','17:10<br>18:25','18:35<br>19:50','20:00<br>21:15'];

function $(id){return document.getElementById(id)}
function showMsg(id,text,ok=true){const el=$(id);el.textContent=text||'';el.className='msg '+(ok?'ok':'err')}
function dateLabel(raw){const p=String(raw).replaceAll('-','/').split('/').map(Number);const d=new Date(p[0],p[1]-1,p[2]);return String(raw).replaceAll('-','/')+'（'+'日月火水木金土'[d.getDay()]+'）'}

async function rest(path, options={}){
  const res = await fetch(SUPABASE_URL + '/rest/v1/' + path, {
    ...options,
    headers: {
      apikey: SUPABASE_KEY,
      Authorization: 'Bearer ' + SUPABASE_KEY,
      'Content-Type': 'application/json',
      Prefer: 'return=representation',
      ...(options.headers || {})
    }
  });
  const text = await res.text();
  if(!res.ok) throw new Error(text || ('HTTP ' + res.status));
  if(!text) return null;
  try{return JSON.parse(text)}catch(e){return text}
}

function setSchool(s){
  school=s;
  $('s1').classList.toggle('on',s==='神領');
  $('s2').classList.toggle('on',s==='大手町');
}

async function findTeacher(code){
  const exact = await rest('teachers?select=code,name,school,email,active&code=eq.' + encodeURIComponent(code));
  if(Array.isArray(exact) && exact.length > 0){
    return exact.find(t => t.active === true || String(t.active).toLowerCase()==='true') || exact[0];
  }

  const all = await rest('teachers?select=code,name,school,email,active');
  if(!Array.isArray(all)) return null;
  return all.find(t => String(t.code).trim() === String(code).trim() && (t.active === true || String(t.active).toLowerCase()==='true')) || null;
}

async function login(){
  try{
    const code=$('code').value.trim();
    if(!code){showMsg('loginMsg','コード番号を入力してください。',false);return}
    showMsg('loginMsg','確認中...',true);

    const found = await findTeacher(code);
    if(!found) throw new Error('コード番号が見つかりません。');

    teacher=found;
    localStorage.setItem('step_teacher_code',code);
    localStorage.setItem('step_teacher_school',school);

    await loadData();
    $('login').classList.add('hidden');
    $('main').classList.remove('hidden');
    $('logoutTop').classList.remove('hidden');
    if($('topBackBtn')) $('topBackBtn').classList.remove('hidden');
    $('teacherName').textContent=school+'校　'+teacher.name+'さん';
  }catch(e){
    showMsg('loginMsg','ログインできません。\n'+(e.message||String(e)),false);
  }
}

async function loadData(){
  days = await rest('class_days?select=school,date,slots&school=eq.' + encodeURIComponent(school) + '&order=date.asc');
  const rows = await rest('availability?select=school,teacher_code,date,slot_index,value&school=eq.' + encodeURIComponent(school) + '&teacher_code=eq.' + encodeURIComponent(teacher.code));
  avail={};
  (rows||[]).forEach(r=>{avail[r.date+'|'+r.slot_index]=r.value});
  render();
}

function render(){
  let h='<table><thead><tr><th class="dateHead">日付</th>';
  timeHeaders.forEach(t=>h+='<th>'+t+'</th>');
  h+='</tr></thead><tbody>';
  (days||[]).forEach(d=>{
    const slots=Array.isArray(d.slots)?d.slots:[true,true,true,true,true,true];
    const closed=slots.every(v=>!v);
    h+='<tr><td class="date">'+dateLabel(d.date)+'</td>';
    for(let i=0;i<6;i++){
      if(closed||!slots[i]) h+='<td>ー</td>';
      else{
        const key=d.date+'|'+i;
        const value=avail[key]||'';
        const cls=value==='○'?'on':(value==='△'?'tri':'');
        h+='<td><button class="slot '+cls+'" type="button" data-key="'+key+'" aria-label="'+value+'"></button></td>';
      }
    }
    h+='</tr>';
  });
  h+='</tbody></table>';
  $('tableArea').innerHTML=h;
}

function toggle(key){
  const current=avail[key]||'';
  if(current==='') avail[key]='○';
  else if(current==='○') avail[key]='△';
  else delete avail[key];
  render();
}

async function save(){
  try{
    showPopup('保存と送信しています。');
    showMsg('saveMsg','保存と送信しています。',true);
    await rest('availability?school=eq.'+encodeURIComponent(school)+'&teacher_code=eq.'+encodeURIComponent(teacher.code),{method:'DELETE'});
    const rows=Object.entries(avail).map(([key,value])=>{
      const [date,slot]=key.split('|');
      return {school,teacher_code:teacher.code,teacher_name:teacher.name,date,slot_index:Number(slot),value};
    });
    if(rows.length>0) await rest('availability',{method:'POST',body:JSON.stringify(rows)});
    showMsg('saveMsg','保存・送信しました。',true);
    hidePopup('保存・送信しました。');
  }catch(e){
    const p=document.getElementById('savePopup'); if(p) p.style.display='none';
    showMsg('saveMsg','保存できません。\n'+(e.message||String(e)),false);
  }
}

function logout(){
  if(!confirm('ログアウトしますか？')) return;
  localStorage.removeItem('step_teacher_code');
  localStorage.removeItem('step_teacher_school');
  location.reload();
}


function goTop(){
  const tw = document.querySelector('.tableWrap');
  if(tw){tw.scrollTop=0;tw.scrollLeft=0;}
  document.documentElement.scrollTop=0;
  document.body.scrollTop=0;
  const top=document.getElementById('pageTop');
  if(top) top.scrollIntoView({behavior:'smooth',block:'start'});
}
function showPopup(text){
  let p=document.getElementById('savePopup');
  if(!p){
    p=document.createElement('div');
    p.id='savePopup';
    p.style.cssText='position:fixed;inset:0;z-index:999;background:rgba(0,0,0,.22);display:flex;align-items:center;justify-content:center;padding:20px';
    p.innerHTML='<div id="savePopupBox" style="background:#fff;border-radius:18px;padding:28px 34px;font-size:24px;font-weight:950;color:#166534;box-shadow:0 20px 50px rgba(0,0,0,.25);text-align:center"></div>';
    document.body.appendChild(p);
  }
  document.getElementById('savePopupBox').textContent=text;
  p.style.display='flex';
}
function hidePopup(text){
  const p=document.getElementById('savePopup');
  const b=document.getElementById('savePopupBox');
  if(b) b.textContent=text;
  if(p) setTimeout(()=>{p.style.display='none'},1200);
}

document.addEventListener('click',e=>{
  const b=e.target.closest('.slot');
  if(b) toggle(b.dataset.key);
});
$('s1').addEventListener('click',()=>setSchool('神領'));
$('s2').addEventListener('click',()=>setSchool('大手町'));
$('loginBtn').addEventListener('click',login);
$('saveBtn').addEventListener('click',save);
$('printBtn').addEventListener('click',()=>window.print());
$('logoutTop').addEventListener('click',logout);
$('topBackBtn').addEventListener('click',goTop);
$('helpToggle').addEventListener('click',()=>{const h=$('helpText');h.classList.toggle('hidden');$('helpToggle').textContent=h.classList.contains('hidden')?'○・△の説明を表示':'○・△の説明を隠す';});

document.addEventListener('DOMContentLoaded',()=>{
  const savedCode=localStorage.getItem('step_teacher_code');
  const savedSchool=localStorage.getItem('step_teacher_school');
  if(savedSchool) setSchool(savedSchool);
  if(savedCode){ $('code').value=savedCode; setTimeout(()=>login(),250); }
});
</script>
</body>
</html>
