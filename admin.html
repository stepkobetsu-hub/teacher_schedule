<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>夏休み出勤管理</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;background:#eef3fb;color:#111827}
.header{background:linear-gradient(135deg,#1565c0,#42a5f5);color:#fff;padding:18px 22px}
.header h1{margin:0;font-size:22px}
.header small{font-size:12px;margin-left:4px}
.header p{margin:6px 0 0;font-size:12px}
.wrap{max-width:1180px;margin:0 auto;padding:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:10px 0}
button{border:0;border-radius:9px;padding:10px 15px;font-weight:800;cursor:pointer}
.school,.tab{background:#e5e7eb;color:#111827}
.school.active,.tab.active{background:#1565c0;color:#fff}
.primary{background:#2e7d32;color:#fff}
.blue{background:#1565c0;color:#fff}
.gray{background:#607d8b;color:#fff}
.orange{background:#e65100;color:#fff}
.red{background:#e53935;color:#fff}
.big{font-size:17px;padding:14px 30px;min-width:230px}
.card{background:#fff;border-radius:14px;padding:18px;margin:14px 0;box-shadow:0 10px 24px rgba(15,23,42,.08)}
.hidden{display:none}
input[type=date],input[type=text]{font-size:16px;padding:9px;border:1px solid #cbd5e1;border-radius:8px}
input[type=checkbox]{width:18px;height:18px}
.tableWrap{overflow:auto;max-height:none}
table{border-collapse:collapse;width:100%;min-width:840px;background:#fff}
th{background:#374151;color:#fff;padding:8px 5px;font-size:12px;white-space:nowrap;position:sticky;top:0;z-index:2}
td{border:1px solid #e5e7eb;text-align:center;padding:5px 4px;font-size:12px}
td.date{font-weight:900;text-align:left;white-space:nowrap;min-width:145px}
td.actions{min-width:210px}
.closed td:not(.date):not(.actions){background:#f3f4f6;color:#555}
.msg{display:none;margin-top:10px;padding:12px;border-radius:10px;font-weight:800;white-space:pre-wrap;line-height:1.5}
.msg.ok{display:block;background:#ecfdf5;border:1px solid #a7f3d0;color:#166534}
.msg.err{display:block;background:#fff7ed;border:1px solid #fed7aa;color:#8a3a1c}
.teacherCard{border:1px solid #e5e7eb;border-radius:12px;margin:12px 0;overflow:hidden;background:#fff}
.teacherTitle{background:#374151;color:#fff;font-weight:900;padding:9px 12px}
.markIcon{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:7px;margin:0 auto}
.markIcon.on{background:#2563eb}
.markIcon.tri{background:#f97316}
.markIcon.on::before{content:"";width:12px;height:12px;border:2px solid #fff;border-radius:50%}
.markIcon.tri::before{content:"";width:0;height:0;border-left:9px solid transparent;border-right:9px solid transparent;border-bottom:17px solid #fff}
.popup{display:none;position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:100;align-items:center;justify-content:center}
.popupBox{background:#fff;border-radius:18px;padding:32px 42px;font-size:24px;font-weight:900;color:#166534;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.small{font-size:12px;color:#64748b;text-align:center;margin-top:18px}
@media print{
  .header,.tabs,.schools,.noPrint,.popup,.msg,.small{display:none!important}
  body{background:#fff;color:#000}
  .wrap{max-width:none;padding:0}
  .card{box-shadow:none;border:0;padding:0;margin:0}
  .teacherCard{break-inside:avoid;border:1px solid #000;border-radius:0}
  .teacherTitle{background:#fff;color:#000;border-bottom:1px solid #000}
  table{min-width:0;width:100%;table-layout:fixed}
  th,td{border:1px solid #000!important;color:#000!important;background:#fff!important;font-size:10px!important;padding:4px 2px!important}
  th{position:static!important}
  td.date{font-size:9px!important}
  .markIcon{background:#fff!important;color:#000!important;width:auto;height:auto}
  .markIcon::before{display:none!important}
  .markIcon.on::after{content:"○"}
  .markIcon.tri::after{content:"△"}
  @page{size:A4 portrait;margin:8mm}
}
</style>
</head>
<body>
<div class="header">
  <h1>夏休み出勤管理 <small>Supabase Ver.1.0</small></h1>
  <p>個別指導ステップ</p>
</div>

<div class="wrap">
  <div class="row schools noPrint">
    <button id="schoolS" class="school active" type="button">神領校</button>
    <button id="schoolO" class="school" type="button">大手町校</button>
  </div>

  <div class="row tabs noPrint">
    <button id="tabSlots" class="tab active" type="button">授業枠設定</button>
    <button id="tabTeachers" class="tab" type="button">先生別一覧</button>
    <button id="tabTeacherMaster" class="tab" type="button">講師登録</button>
  </div>

  <section id="viewSlots" class="card">
    <h2>授業枠設定</h2>
    <p>ここで作った日付・時間帯が、講師アプリ・先生別一覧・印刷の基準になります。</p>

    <div class="row noPrint">
      <b>期間設定</b>
      <input id="rangeStart" type="date"> <span>〜</span> <input id="rangeEnd" type="date">
      <button id="makeRange" class="gray" type="button">期間の枠を作成</button>
    </div>

    <div class="row noPrint">
      <b>授業日の追加</b>
      <input id="singleDate" type="date">
      <button id="addDay" class="blue" type="button">授業日を追加</button>
      <button id="saveSlots" class="primary big" style="margin-left:auto" type="button">保存する</button>
      <button id="reloadSlots" class="gray" type="button">再読み込み</button>
    </div>

    <div id="slotsArea" class="tableWrap"></div>
    <div id="slotsMsg" class="msg"></div>
  </section>

  <section id="viewTeachers" class="card hidden">
    <h2>先生別一覧</h2>
    <div class="row noPrint">
      <button id="reloadTeachers" class="gray" type="button">再読み込み</button>
      <button id="printBtn" class="gray" type="button">印刷する</button>
    </div>
    <div id="teachersArea"></div>
    <div id="teachersMsg" class="msg"></div>
  </section>

  <section id="viewTeacherMaster" class="card hidden">
    <h2>講師登録</h2>
    <div class="row noPrint">
      <input id="newCode" type="text" placeholder="コード 例:7002">
      <input id="newName" type="text" placeholder="氏名">
      <button id="addTeacher" class="primary" type="button">追加/更新</button>
      <button id="reloadTeacherMaster" class="gray" type="button">再読み込み</button>
    </div>
    <div id="teacherMasterArea"></div>
    <div id="teacherMasterMsg" class="msg"></div>
  </section>

  <div class="small noPrint">Build Supabase Ver.1.0</div>
</div>

<div id="savePopup" class="popup noPrint"><div class="popupBox">保存しました</div></div>

<script>
const SUPABASE_URL = 'https://jbiolkvegexkqjcwtyye.supabase.co';
const SUPABASE_KEY = 'sb_publishable_1si6OSrS0AGP19FstAudug_ErlLMMqX';

let school = '神領';
let tab = 'slots';
let slotConfig = [];
let teachers = [];
let availability = [];

const timeLabels = ['13:00<br>14:15','14:20<br>15:35','15:45<br>17:00','17:10<br>18:25','18:35<br>19:50','20:00<br>21:15'];
const timeShort = ['13:00','14:20','15:45','17:10','18:35','20:00'];

function $(id){return document.getElementById(id)}

function msg(id,t,ok=true){
  const e=$(id);
  e.textContent=t||'';
  e.className='msg '+(ok?'ok':'err');
  e.style.display=t?'block':'none';
}

function rawFromInput(id){
  const v=$(id).value;
  if(!v)return '';
  const p=v.split('-');
  return p[0]+'/'+p[1]+'/'+p[2];
}

function inputFromRaw(s){
  return s ? String(s).replaceAll('/','-').slice(0,10) : '';
}

function label(raw){
  if(!raw)return '';
  const p=String(raw).replaceAll('-','/').split('/').map(Number);
  const d=new Date(p[0],p[1]-1,p[2]);
  return String(raw).replaceAll('-','/')+'（'+'日月火水木金土'[d.getDay()]+'）';
}

async function rest(path, options={}){
  const res = await fetch(SUPABASE_URL + '/rest/v1/' + path, {
    ...options,
    headers:{
      apikey: SUPABASE_KEY,
      Authorization: 'Bearer ' + SUPABASE_KEY,
      'Content-Type':'application/json',
      Prefer:'return=representation',
      ...(options.headers||{})
    }
  });

  const text = await res.text();
  if(!res.ok) throw new Error(text || ('HTTP '+res.status));
  if(!text) return null;
  try{return JSON.parse(text)}catch(e){return text}
}

function setSchool(s){
  school=s;
  $('schoolS').classList.toggle('active',s==='神領');
  $('schoolO').classList.toggle('active',s==='大手町');
  loadCurrent();
}

function setTab(t){
  tab=t;
  $('tabSlots').classList.toggle('active',t==='slots');
  $('tabTeachers').classList.toggle('active',t==='teachers');
  $('tabTeacherMaster').classList.toggle('active',t==='master');

  $('viewSlots').classList.toggle('hidden',t!=='slots');
  $('viewTeachers').classList.toggle('hidden',t!=='teachers');
  $('viewTeacherMaster').classList.toggle('hidden',t!=='master');

  loadCurrent();
}

function loadCurrent(){
  if(tab==='slots') loadSlots();
  if(tab==='teachers') loadTeachersView();
  if(tab==='master') loadTeacherMaster();
}

async function loadSlots(){
  msg('slotsMsg','読み込み中...',true);
  try{
    const rows = await rest('class_days?select=school,date,slots&school=eq.'+encodeURIComponent(school)+'&order=date.asc');
    slotConfig = (rows||[]).map(r=>({date:r.date,slots:Array.isArray(r.slots)?r.slots:[true,true,true,true,true,true]}));
    renderSlots();
    msg('slotsMsg','読み込みました。',true);
  }catch(e){
    msg('slotsMsg','読み込みできません。\n'+(e.message||String(e)),false);
  }
}

function renderSlots(){
  let h='<table><thead><tr><th>日付</th>';
  timeLabels.forEach(t=>h+='<th>'+t+'</th>');
  h+='<th class="noPrint">操作</th></tr></thead><tbody>';

  slotConfig.forEach((r,i)=>{
    const closed=(r.slots||[]).every(v=>!v);
    h+='<tr class="'+(closed?'closed':'')+'"><td class="date">'+label(r.date)+'</td>';

    for(let j=0;j<6;j++){
      h+='<td>'+(closed?'ー':'<input type="checkbox" data-i="'+i+'" data-j="'+j+'" '+(r.slots[j]?'checked':'')+'>')+'</td>';
    }

    h+='<td class="actions noPrint">';
    h+='<button class="primary" type="button" onclick="classDay('+i+')">授業</button> ';
    h+='<button class="gray" type="button" onclick="closeDay('+i+')">休校</button> ';
    h+='<button class="red" type="button" onclick="deleteDay('+i+')">削除</button>';
    h+='</td></tr>';
  });

  h+='</tbody></table>';
  $('slotsArea').innerHTML=h;
}

function classDay(i){slotConfig[i].slots=[true,true,true,true,true,true];renderSlots()}
function closeDay(i){slotConfig[i].slots=[false,false,false,false,false,false];renderSlots()}
function deleteDay(i){if(confirm(label(slotConfig[i].date)+'を削除しますか？')){slotConfig.splice(i,1);renderSlots()}}

function addRaw(raw){
  if(!raw){msg('slotsMsg','日付を選んでください。',false);return}
  if(slotConfig.some(r=>r.date===raw)){msg('slotsMsg','同じ日付があります。',false);return}
  slotConfig.push({date:raw,slots:[true,true,true,true,true,true]});
  slotConfig.sort((a,b)=>a.date<b.date?-1:1);
  renderSlots();
  msg('slotsMsg','追加しました。保存ボタンを押すと反映されます。',true);
}

function addDay(){
  addRaw(rawFromInput('singleDate'));
  $('singleDate').value='';
}

function makeRange(){
  const s=$('rangeStart').value;
  const e=$('rangeEnd').value;
  if(!s||!e){msg('slotsMsg','開始日と終了日を選んでください。',false);return}

  const sp=s.split('-').map(Number);
  const ep=e.split('-').map(Number);
  const start=new Date(sp[0],sp[1]-1,sp[2]);
  const end=new Date(ep[0],ep[1]-1,ep[2]);

  if(start>end){msg('slotsMsg','終了日は開始日より後にしてください。',false);return}

  const map={};
  slotConfig.forEach(r=>map[r.date]=r);

  for(let d=new Date(start);d<=end;d.setDate(d.getDate()+1)){
    const raw=d.getFullYear()+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+String(d.getDate()).padStart(2,'0');
    if(!map[raw]) map[raw]={date:raw,slots:[true,true,true,true,true,true]};
  }

  slotConfig=Object.values(map).sort((a,b)=>a.date<b.date?-1:1);
  renderSlots();
  msg('slotsMsg','期間の枠を作成しました。保存してください。',true);
}

async function saveSlots(){
  try{
    document.querySelectorAll('#slotsArea input[type=checkbox]').forEach(c=>{
      slotConfig[Number(c.dataset.i)].slots[Number(c.dataset.j)]=c.checked;
    });

    msg('slotsMsg','保存中...',true);

    await rest('class_days?school=eq.'+encodeURIComponent(school),{method:'DELETE'});

    const rows=slotConfig.map(r=>({school:school,date:r.date,slots:r.slots}));
    if(rows.length>0){
      await rest('class_days',{method:'POST',body:JSON.stringify(rows)});
    }

    msg('slotsMsg','保存しました。件数：'+rows.length,true);
    $('savePopup').style.display='flex';
    setTimeout(()=>{$('savePopup').style.display='none'},1200);
    await loadSlots();
  }catch(e){
    msg('slotsMsg','保存できません。\n'+(e.message||String(e)),false);
  }
}

async function loadTeachersView(){
  msg('teachersMsg','読み込み中...',true);
  try{
    const t = await rest('teachers?select=code,name,school,active&school=eq.'+encodeURIComponent(school)+'&active=eq.true&order=code.asc');
    const d = await rest('class_days?select=school,date,slots&school=eq.'+encodeURIComponent(school)+'&order=date.asc');
    const a = await rest('availability?select=school,teacher_code,date,slot_index,value&school=eq.'+encodeURIComponent(school));

    teachers=t||[];
    slotConfig=(d||[]).map(r=>({date:r.date,slots:Array.isArray(r.slots)?r.slots:[true,true,true,true,true,true]}));
    availability=a||[];

    renderTeachers();
    msg('teachersMsg','読み込みました。',true);
  }catch(e){
    msg('teachersMsg','読み込みできません。\n'+(e.message||String(e)),false);
  }
}

function markHtml(v){
  if(v==='○') return '<span class="markIcon on"></span>';
  if(v==='△') return '<span class="markIcon tri"></span>';
  return '';
}

function renderTeachers(){
  if(!teachers.length){
    $('teachersArea').innerHTML='<p>まだ登録データがありません。</p>';
    return;
  }

  let h='';
  teachers.forEach(t=>{
    h+='<div class="teacherCard"><div class="teacherTitle">'+t.code+'　'+t.name+'</div><div class="tableWrap">';
    h+='<table><thead><tr><th>日付</th>';
    timeShort.forEach(x=>h+='<th>'+x+'</th>');
    h+='</tr></thead><tbody>';

    slotConfig.forEach(d=>{
      const closed=(d.slots||[]).every(v=>!v);
      h+='<tr class="'+(closed?'closed':'')+'"><td class="date">'+label(d.date)+'</td>';

      for(let i=0;i<6;i++){
        if(closed||!d.slots[i]){
          h+='<td>ー</td>';
        }else{
          const row=availability.find(a=>a.teacher_code===t.code&&a.date===d.date&&Number(a.slot_index)===i);
          h+='<td>'+markHtml(row?row.value:'')+'</td>';
        }
      }

      h+='</tr>';
    });

    h+='</tbody></table></div></div>';
  });

  $('teachersArea').innerHTML=h;
}

async function loadTeacherMaster(){
  msg('teacherMasterMsg','読み込み中...',true);
  try{
    const rows = await rest('teachers?select=code,name,school,active&order=code.asc');
    let h='<table><thead><tr><th>コード</th><th>氏名</th><th>校舎</th><th>有効</th></tr></thead><tbody>';
    (rows||[]).forEach(t=>{
      h+='<tr><td>'+t.code+'</td><td>'+t.name+'</td><td>'+t.school+'</td><td>'+(t.active?'○':'')+'</td></tr>';
    });
    h+='</tbody></table>';
    $('teacherMasterArea').innerHTML=h;
    msg('teacherMasterMsg','読み込みました。',true);
  }catch(e){
    msg('teacherMasterMsg','読み込みできません。\n'+(e.message||String(e)),false);
  }
}

async function addTeacher(){
  try{
    const code=$('newCode').value.trim();
    const name=$('newName').value.trim();
    if(!code||!name){msg('teacherMasterMsg','コードと氏名を入力してください。',false);return}

    const row={code:code,name:name,school:school,active:true};
    await rest('teachers',{method:'POST',body:JSON.stringify(row),headers:{Prefer:'resolution=merge-duplicates'}});

    $('newCode').value='';
    $('newName').value='';
    msg('teacherMasterMsg','保存しました。',true);
    await loadTeacherMaster();
  }catch(e){
    msg('teacherMasterMsg','保存できません。\n'+(e.message||String(e)),false);
  }
}

$('schoolS').onclick=()=>setSchool('神領');
$('schoolO').onclick=()=>setSchool('大手町');
$('tabSlots').onclick=()=>setTab('slots');
$('tabTeachers').onclick=()=>setTab('teachers');
$('tabTeacherMaster').onclick=()=>setTab('master');
$('makeRange').onclick=makeRange;
$('addDay').onclick=addDay;
$('saveSlots').onclick=saveSlots;
$('reloadSlots').onclick=loadSlots;
$('reloadTeachers').onclick=loadTeachersView;
$('printBtn').onclick=()=>window.print();
$('addTeacher').onclick=addTeacher;
$('reloadTeacherMaster').onclick=loadTeacherMaster;

loadSlots();
</script>
</body>
</html>
