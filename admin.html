<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>夏休み出勤管理</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;background:#f3f6fb;color:#111827}
.hero{background:linear-gradient(135deg,#1565c0,#42a5f5);color:white;padding:18px 16px}
.hero h1{margin:0;font-size:22px}.hero p{margin:5px 0 0;font-size:12px;opacity:.9}
.wrap{max-width:1180px;margin:0 auto;padding:14px}
.card{background:white;border-radius:14px;padding:14px;margin-bottom:14px;box-shadow:0 8px 24px rgba(15,23,42,.08)}
.tabs,.schools,.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
button{border:0;border-radius:10px;padding:10px 14px;font-weight:800;cursor:pointer}
.tab{background:#e5e7eb;color:#374151}.tab.active{background:#1565c0;color:white}
.school{background:white;border:2px solid #d1d5db;color:#374151}.school.active{border-color:#1565c0;background:#eff6ff;color:#1565c0}
.primary{background:#2e7d32;color:white}.primary.bigSave{margin-left:auto;min-width:190px;font-size:17px;padding:14px 26px}.warn{background:#e65100;color:white}.gray{background:#607d8b;color:white}.danger{background:#e53935;color:white}.stateOn{box-shadow:0 0 0 3px rgba(46,125,50,.25);outline:2px solid #2e7d32}.stateOff{box-shadow:0 0 0 3px rgba(96,125,139,.25);outline:2px solid #607d8b}.blue{background:#1565c0;color:white}
.long{min-width:240px;font-size:16px;padding:13px 26px}
.msg{display:none;margin-top:10px;padding:10px;border-radius:10px;font-weight:800;line-height:1.5;white-space:pre-wrap}
.msg.ok{display:block;background:#ecfdf5;border:1px solid #a7f3d0;color:#166534}.msg.err{display:block;background:#fff7ed;border:1px solid #fed7aa;color:#8a3a1c}
.table-wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:820px;background:white}
th{background:#374151;color:white;padding:7px 5px;font-size:12px;white-space:nowrap}
td{border:1px solid #e5e7eb;text-align:center;padding:4px 3px;font-size:12px;height:26px}
td.date{font-weight:800;white-space:nowrap;text-align:left;min-width:145px}
td.actions{min-width:190px}
input[type=date]{font-size:15px;padding:9px;border:1px solid #d1d5db;border-radius:8px}input[type=checkbox]{width:18px;height:18px}
.hidden{display:none}.teacher-card{break-inside:avoid;background:white;border-radius:12px;margin-bottom:14px;overflow:hidden;border:1px solid #e5e7eb}
.teacher-title{background:#374151;color:white;padding:9px 12px;font-weight:900}.mark{font-weight:900;font-size:15px}.on{color:#2563eb}.tri{color:#f97316}
.small{font-size:12px;color:#6b7280}.closed-row td:not(.date):not(.actions){color:#555;background:#f3f4f6}
.deadlineLabel{font-size:22px;font-weight:900;color:#1565c0;background:#eff6ff;border:1px solid #bfdbfe;border-radius:10px;padding:8px 12px;min-width:190px;text-align:center}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;align-items:center;justify-content:center;padding:16px}
.modal-box{background:white;border-radius:16px;max-width:520px;width:100%;max-height:80vh;overflow:auto;padding:18px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.teacher-checks label{display:block;padding:7px 4px;border-bottom:1px solid #eee}
.popup{display:none;position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:100;align-items:center;justify-content:center}.popupBox{background:white;border-radius:18px;padding:32px 42px;font-size:24px;font-weight:900;color:#166534;box-shadow:0 20px 50px rgba(0,0,0,.25)}
@media print{
  body{background:#fff!important;color:#000!important}.no-print,.tabs,.schools,.hero,.modal{display:none!important}
  .wrap{max-width:none!important;padding:0!important}.card{box-shadow:none!important;border:0!important;padding:0!important;margin:0!important}
  .teacher-card{page-break-inside:avoid;border:1px solid #000!important;border-radius:0!important;margin-bottom:12px!important}
  .teacher-title{background:#fff!important;color:#000!important;border-bottom:1px solid #000!important}
  .table-wrap{overflow:visible!important}table{min-width:0!important;width:100%!important;border-collapse:collapse!important}
  th,td{border:1px solid #000!important;color:#000!important;background:#fff!important;padding:4px 3px!important;font-size:10px!important}
  th{font-weight:900!important}td.date{color:#000!important;background:#fff!important;font-weight:900!important}
  .mark,.on,.tri{color:#000!important;font-weight:900!important}.small{color:#000!important}
  @page{size:A4 portrait;margin:8mm}
}
</style></head>
<body>
<div class="hero"><h1>夏休み出勤管理 <span style="font-size:12px">Ver.2.3</span></h1><p>個別指導ステップ</p></div>
<div class="wrap">
<div class="schools no-print"><button id="schoolShinryo" class="school active">神領校</button><button id="schoolOtemachi" class="school">大手町校</button></div>
<div class="tabs no-print"><button id="tabSlots" class="tab active">授業枠設定</button><button id="tabDeadline" class="tab">締切設定</button><button id="tabTeachers" class="tab">先生別一覧</button></div>

<section id="viewSlots" class="card">
<h2>授業枠設定</h2><p class="small">ここで作った日付・時間帯が、講師アプリ・先生別一覧・印刷の基準になります。</p>
<div class="row no-print"><b>期間設定</b><input id="rangeStart" type="date"><span>〜</span><input id="rangeEnd" type="date"><button class="gray" id="makeRangeBtn">期間の枠を作成</button></div>
<div class="row no-print"><b>授業日の追加</b><input id="singleDate" type="date"><button class="blue" id="addSingleDateBtn">授業日を追加</button><button class="primary bigSave" id="saveSlotsBtn">保存する</button><button class="gray" id="reloadSlotsBtn">再読み込み</button></div>
<div id="slotsArea" class="table-wrap"></div><div id="slotsMsg" class="msg"></div>
</section>

<section id="viewDeadline" class="card hidden">
<h2>締切設定</h2>
<div class="row"><label><b>神領校</b></label><input id="deadlineShinryo" type="date"><span id="deadlineShinryoLabel" class="deadlineLabel"></span><button class="primary" onclick="saveDeadline('神領')">神領を保存</button></div>
<div class="row"><label><b>大手町校</b></label><input id="deadlineOtemachi" type="date"><span id="deadlineOtemachiLabel" class="deadlineLabel"></span><button class="primary" onclick="saveDeadline('大手町')">大手町を保存</button></div>
<button class="gray" id="reloadDeadlineBtn">再読み込み</button><div id="deadlineMsg" class="msg"></div>
</section>

<section id="viewTeachers" class="card hidden">
<h2>先生別一覧</h2>
<div class="row no-print"><button class="gray" id="reloadTeachersBtn">再読み込み</button><button class="warn long" id="bulkWriteBtn">時間割に一括登録</button><button class="gray" id="printSelectBtn">印刷する</button></div>
<div id="teachersArea"></div><div id="teachersMsg" class="msg"></div>
</section>
<div class="small no-print" style="text-align:center;margin:18px">Build 2026-06-28 12:35</div>
</div>

<div id="savePopup" class="popup no-print"><div class="popupBox">保存しました</div></div>
<div id="selectModal" class="modal no-print"><div class="modal-box"><h3 id="modalTitle">対象の先生を選択</h3><div class="row"><button class="gray" onclick="selectAllTeachers(true)">全員選択</button><button class="gray" onclick="selectAllTeachers(false)">全員解除</button></div><div id="teacherChecks" class="teacher-checks"></div><div class="row" style="margin-top:14px"><button class="primary" id="modalRunBtn">実行</button><button class="danger" onclick="closeModal()">閉じる</button></div></div></div>

<script>
const GAS_API='https://script.google.com/macros/s/AKfycbx8UeG5X_WSonK8StzuB8B_iC4BACDw3guGZgQvuSAWnxJCfUwnsycZLC5Wn19HBGO3pQ/exec';
let school='神領', activeTab='slots', slotConfig=[], teacherData=[], printFilterCodes=null, modalMode='print', lastTeacherResult=null;
function $(id){return document.getElementById(id)}
function showMsg(id,text,ok=true){const e=$(id);e.textContent=text||'';e.className='msg '+(ok?'ok':'err');e.style.display=text?'block':'none'}
function ymdToInput(s){return s?String(s).replaceAll('/','-').slice(0,10):''}
function inputToYmd(s){return s?String(s).replaceAll('-','/'):''}
function inputDateToRaw(id){const v=$(id).value;if(!v)return '';const p=v.split('-');return p[0]+'/'+p[1]+'/'+p[2]}
function dateLabel(raw){if(!raw)return '';const d=new Date(String(raw).replaceAll('/','-'));if(isNaN(d))return raw;return raw.replaceAll('-','/')+'（'+'日月火水木金土'[d.getDay()]+'）'}
function jsonp(params){return new Promise((resolve,reject)=>{const cb='cb_'+Date.now()+'_'+Math.random().toString(36).slice(2);const url=new URL(GAS_API);Object.entries(params).forEach(([k,v])=>url.searchParams.set(k,v));url.searchParams.set('callback',cb);url.searchParams.set('_',Date.now());const script=document.createElement('script');const timer=setTimeout(()=>{cleanup();reject(new Error('通信タイムアウト'))},20000);function cleanup(){clearTimeout(timer);delete window[cb];if(script.parentNode)script.parentNode.removeChild(script)}window[cb]=data=>{cleanup();resolve(data)};script.onerror=()=>{cleanup();reject(new Error('GAS通信に失敗しました'))};script.src=url.toString();document.body.appendChild(script)})}
function setSchool(s){school=s;$('schoolShinryo').classList.toggle('active',s==='神領');$('schoolOtemachi').classList.toggle('active',s==='大手町');loadActive()}
function setTab(t){activeTab=t;$('tabSlots').classList.toggle('active',t==='slots');$('tabDeadline').classList.toggle('active',t==='deadline');$('tabTeachers').classList.toggle('active',t==='teachers');$('viewSlots').classList.toggle('hidden',t!=='slots');$('viewDeadline').classList.toggle('hidden',t!=='deadline');$('viewTeachers').classList.toggle('hidden',t!=='teachers');loadActive()}
function loadActive(){if(activeTab==='slots')loadSlots();if(activeTab==='deadline')loadDeadlines();if(activeTab==='teachers')loadTeachers()}

async function loadSlots(){showMsg('slotsMsg','読み込み中...',true);try{const r=await jsonp({action:'getSlotConfig',school});if(!r.ok)throw new Error(r.error||'取得できません');slotConfig=r.config||[];renderSlots();showMsg('slotsMsg','読み込みました。',true)}catch(e){showMsg('slotsMsg',e.message||String(e),false)}}
function renderSlots(){const labels=['13:00-14:15','14:20-15:35','15:45-17:00','17:10-18:25','18:35-19:50','20:00-21:15'];let h='<table><thead><tr><th>日付</th>';labels.forEach(l=>h+='<th>'+l.replace('-','<br>')+'</th>');h+='<th class="no-print">操作</th></tr></thead><tbody>';slotConfig.forEach((row,idx)=>{const closed=(row.enabled||[]).every(v=>!v);h+='<tr class="'+(closed?'closed-row':'')+'"><td class="date">'+dateLabel(row.rawDate)+'</td>';for(let i=0;i<6;i++)h+='<td>'+(closed?'-':'<input type="checkbox" data-idx="'+idx+'" data-slot="'+i+'" '+(row.enabled[i]?'checked':'')+'>')+'</td>';h+='<td class="actions no-print"><button class="primary '+(!closed?'stateOn':'')+'" onclick="setClassDay('+idx+')">授業</button> <button class="gray '+(closed?'stateOff':'')+'" onclick="setClosed('+idx+')">休校</button> <button class="danger" onclick="deleteDay('+idx+')">削除</button></td></tr>'});h+='</tbody></table>';$('slotsArea').innerHTML=h}
function setClassDay(idx){slotConfig[idx].enabled=[true,true,true,true,true,true];renderSlots()}
function setClosed(idx){slotConfig[idx].enabled=[false,false,false,false,false,false];renderSlots()}
function deleteDay(idx){if(confirm(dateLabel(slotConfig[idx].rawDate)+' を削除しますか？')){slotConfig.splice(idx,1);renderSlots()}}
function addDateRaw(raw){if(!raw){showMsg('slotsMsg','日付を選んでください。',false);return false}if(slotConfig.some(r=>r.rawDate===raw)){showMsg('slotsMsg','同じ日付があります。',false);return false}slotConfig.push({rawDate:raw,date:dateLabel(raw),holiday:false,enabled:[true,true,true,true,true,true]});slotConfig.sort((a,b)=>a.rawDate<b.rawDate?-1:1);renderSlots();return true}
function addSingleDate(){const ok=addDateRaw(inputDateToRaw('singleDate'));if(ok){$('singleDate').value='';showMsg('slotsMsg','授業日を追加しました。保存ボタンを押すと反映されます。',true)}}
function makeRange(){const s=$('rangeStart').value,e=$('rangeEnd').value;if(!s||!e){showMsg('slotsMsg','開始日と終了日を選んでください。',false);return}const sp=s.split('-').map(Number),ep=e.split('-').map(Number);const start=new Date(sp[0],sp[1]-1,sp[2]),end=new Date(ep[0],ep[1]-1,ep[2]);if(start>end){showMsg('slotsMsg','終了日は開始日より後にしてください。',false);return}const map={};slotConfig.forEach(r=>map[r.rawDate]=r);for(let d=new Date(start);d<=end;d.setDate(d.getDate()+1)){const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');const raw=y+'/'+m+'/'+day;if(!map[raw])map[raw]={rawDate:raw,date:dateLabel(raw),holiday:false,enabled:[true,true,true,true,true,true]}}slotConfig=Object.values(map).sort((a,b)=>a.rawDate<b.rawDate?-1:1);renderSlots();showMsg('slotsMsg','期間の枠を作成しました。保存ボタンを押すと反映されます。',true)}
async function saveSlots(){
  document.querySelectorAll('#slotsArea input[type=checkbox]').forEach(cb=>{
    const idx=Number(cb.dataset.idx), slot=Number(cb.dataset.slot);
    slotConfig[idx].enabled[slot]=cb.checked;
  });

  showMsg('slotsMsg','保存中です。しばらくお待ちください...',true);
  const btn=$('saveSlotsBtn');
  if(btn) btn.disabled=true;

  try{
    let r=await jsonp({action:'beginSlotConfigSave',school});
    if(!r.ok) throw new Error(r.error||'保存を開始できません');

    const chunkSize=8;
    let total=0;
    for(let i=0;i<slotConfig.length;i+=chunkSize){
      const chunk=slotConfig.slice(i,i+chunkSize);
      r=await jsonp({action:'appendSlotConfigChunk',school,chunk:JSON.stringify(chunk)});
      if(!r.ok) throw new Error(r.error||'保存中にエラーが出ました');
      total += r.appended || chunk.length;
      showMsg('slotsMsg','保存中です... '+Math.min(i+chunkSize,slotConfig.length)+' / '+slotConfig.length,true);
    }

    r=await jsonp({action:'finishSlotConfigSave',school});
    if(!r.ok) throw new Error(r.error||'保存確認に失敗しました');

    showMsg('slotsMsg','保存しました。件数：'+r.saved,true);
    showSavePopup();
  }catch(e){
    showMsg('slotsMsg','保存中に通信エラーが出ました。再読み込みして、保存されているか確認してください。
'+(e.message||String(e)),false);
  }finally{
    if(btn) btn.disabled=false;
  }
}

async function loadDeadlines(){showMsg('deadlineMsg','読み込み中...',true);try{const r=await jsonp({action:'getDeadlines'});if(!r.ok)throw new Error(r.error||'取得できません');$('deadlineShinryo').value=ymdToInput(r['神領']);$('deadlineOtemachi').value=ymdToInput(r['大手町']);updateDeadlineLabels();showMsg('deadlineMsg','読み込みました。',true)}catch(e){showMsg('deadlineMsg',e.message||String(e),false)}}
function updateDeadlineLabels(){$('deadlineShinryoLabel').textContent=dateLabel(inputToYmd($('deadlineShinryo').value));$('deadlineOtemachiLabel').textContent=dateLabel(inputToYmd($('deadlineOtemachi').value))}
async function saveDeadline(s){const v=s==='神領'?$('deadlineShinryo').value:$('deadlineOtemachi').value;showMsg('deadlineMsg','保存中...',true);try{const r=await jsonp({action:'saveDeadline',school:s,dateStr:inputToYmd(v)});if(!r.ok)throw new Error(r.error||'保存できません');showMsg('deadlineMsg',s+'校の締切を保存しました。 '+dateLabel(inputToYmd(v)),true)}catch(e){showMsg('deadlineMsg',e.message||String(e),false)}}

async function loadTeachers(){showMsg('teachersMsg','読み込み中...',true);try{const r=await jsonp({action:'getTeacherCalendar',school});if(!r.ok)throw new Error(r.error||'取得できません');lastTeacherResult=r;teacherData=r.teachers||[];renderTeachers(r);showMsg('teachersMsg','読み込みました。',true)}catch(e){showMsg('teachersMsg',e.message||String(e),false)}}
function renderTeachers(r){const teachers=(r.teachers||[]).filter(t=>!printFilterCodes||printFilterCodes.includes(t.code));const slots=r.slots||[];const labels=['13:00','14:20','15:45','17:10','18:35','20:00'];if(teachers.length===0){$('teachersArea').innerHTML='<p>まだ登録データがありません。</p>';return}let html='';teachers.forEach(t=>{html+='<div class="teacher-card" data-code="'+t.code+'"><div class="teacher-title">'+t.code+'　'+t.name+'</div><div class="table-wrap"><table><thead><tr><th>日付</th>';labels.forEach(l=>html+='<th>'+l+'</th>');html+='</tr></thead><tbody>';slots.forEach(sl=>{const closed=(sl.enabled||[]).every(v=>!v);html+='<tr class="'+(closed?'closed-row':'')+'"><td class="date">'+sl.date+'</td>';for(let i=0;i<6;i++){const v=closed?'-':(t.entries[sl.rawDate+'|'+i]||'');const cls=v==='○'?'on':(v==='△'?'tri':'');html+='<td><span class="mark '+cls+'">'+v+'</span></td>'}html+='</tr>'});html+='</tbody></table></div></div>'});$('teachersArea').innerHTML=html}
function openSelectModal(mode){modalMode=mode;$('modalTitle').textContent=mode==='print'?'印刷する先生を選択':'一括登録する先生を選択';let h='';teacherData.forEach(t=>{h+='<label><input class="teacherCheck" type="checkbox" value="'+t.code+'" checked> '+t.code+'　'+t.name+'</label>'});$('teacherChecks').innerHTML=h;$('selectModal').style.display='flex'}
function closeModal(){$('selectModal').style.display='none'}
function selectAllTeachers(v){document.querySelectorAll('.teacherCheck').forEach(c=>c.checked=v)}
function selectedCodesFromModal(){return Array.from(document.querySelectorAll('.teacherCheck:checked')).map(c=>c.value)}
async function runModal(){const codes=selectedCodesFromModal();closeModal();if(modalMode==='print'){printFilterCodes=codes;renderTeachers(lastTeacherResult);setTimeout(()=>{window.print();printFilterCodes=null;renderTeachers(lastTeacherResult)},200)}else{await bulkWrite(codes)}}
async function bulkWrite(codes){const count=codes&&codes.length?codes.length:teacherData.length;if(!confirm(school+'校の '+count+' 名を「全体時間割」へ一括登録します。よろしいですか？'))return;showMsg('teachersMsg','時間割へ書き込み中...',true);try{const r=await jsonp({action:'bulkWriteToSchedule',school,codes:JSON.stringify(codes||[])});if(!r.ok)throw new Error(r.error||'一括登録できません');let msg='時間割へ一括登録しました。書き込み：'+r.written+'件';if(r.addedRows)msg+='、追加行：'+r.addedRows+'行';if(r.notFound&&r.notFound.length)msg+='\n\n※日付が見つからない日：\n'+r.notFound.join('\n');showMsg('teachersMsg',msg,true)}catch(e){showMsg('teachersMsg',e.message||String(e),false)}}
function showSavePopup(){const p=$('savePopup');p.style.display='flex';setTimeout(()=>{p.style.display='none'},1500)}
document.addEventListener('DOMContentLoaded',()=>{$('schoolShinryo').onclick=()=>setSchool('神領');$('schoolOtemachi').onclick=()=>setSchool('大手町');$('tabSlots').onclick=()=>setTab('slots');$('tabDeadline').onclick=()=>setTab('deadline');$('tabTeachers').onclick=()=>setTab('teachers');$('makeRangeBtn').onclick=makeRange;$('addSingleDateBtn').onclick=addSingleDate;$('saveSlotsBtn').onclick=saveSlots;$('reloadSlotsBtn').onclick=loadSlots;$('deadlineShinryo').onchange=updateDeadlineLabels;$('deadlineOtemachi').onchange=updateDeadlineLabels;$('reloadDeadlineBtn').onclick=loadDeadlines;$('reloadTeachersBtn').onclick=loadTeachers;$('bulkWriteBtn').onclick=()=>openSelectModal('bulk');$('printSelectBtn').onclick=()=>openSelectModal('print');$('modalRunBtn').onclick=runModal;loadSlots()});
</script></body></html>
